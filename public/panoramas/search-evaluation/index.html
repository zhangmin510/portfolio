* {

h2,
h3,
h4,
h5,
h6,

h3,

h5,

}

b,
strong,

}

.table :is(th, td):last-child {

}

.table :is(caption, thead th) {

}

.table thead th {

}

}

.table :is(.text-center, [align=&quot;center&quot;]) {

}

.table .text-nowrap {

}

#widget {

  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;

}

.card {

  corner-shape: var(--corner-shape);

  color: var(--foreground);

.tabular-nums {

.btn,

      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();
&lt;/script&gt;

  &lt;script&gt;
  (() =&gt; {

    const lanes = [&#x27;检索与排序&#x27;, &#x27;答案与推理&#x27;, &#x27;证据与可信&#x27;, &#x27;联网与研究&#x27;];
    const colors = [&#x27;var(--viz-series-2)&#x27;, &#x27;var(--viz-series-3)&#x27;, &#x27;var(--viz-series-5)&#x27;, &#x27;var(--viz-series-6)&#x27;];
    const eras = [
      [&#x27;1957—1997&#x27;, &#x27;相关性范式&#x27;], [&#x27;1998—2017&#x27;, &#x27;Web 排名&#x27;], [&#x27;2018—2020&#x27;, &#x27;答案与证据&#x27;],
      [&#x27;2021—2023&#x27;, &#x27;RAG 与工具&#x27;], [&#x27;2024—2025&#x27;, &#x27;联网研究&#x27;], [&#x27;2026&#x27;, &#x27;动态与多模态&#x27;],
      [&#x27;已观察趋势&#x27;, &#x27;2023—2026&#x27;], [&#x27;展望&#x27;, &#x27;方向推断&#x27;]
    ];
    const nodes = [
      {id:&#x27;cranfield&#x27;,label:&#x27;Cranfield 范式&#x27;,date:&#x27;1957—1966 · 项目与报告&#x27;,era:0,lane:0,type:&#x27;fixed&#x27;,scope:&#x27;固定文献集 / Web 之前&#x27;,mechanism:&#x27;文档集 + 查询 + 相关性判断：用 Precision、Recall 比较索引和检索方法。&#x27;,note:&#x27;建立可复现的检索实验基础；专业小语料不能代表后来开放 Web 的动态环境。&#x27;,sources:[[&#x27;Cranfield 原始项目报告&#x27;,&#x27;https://sigir.org/files/museum/ASLIB%20CRANFIELD%20RESEARCH%20PROJECT-1960/pdfs/p1-chapter_1.pdf&#x27;],[&#x27;Cranfield II · 1966&#x27;,&#x27;https://sigir.org/files/museum/Factors_Determining_the_Performace_of_Indexing_Systems_Vol_2/pdfs/frontmatter.pdf&#x27;]]},
      {id:&#x27;trec&#x27;,label:&#x27;TREC 共同评测&#x27;,date:&#x27;1992 · 首届评测&#x27;,era:0,lane:0,type:&#x27;fixed&#x27;,scope:&#x27;固定语料 / 相关性标注&#x27;,mechanism:&#x27;以统一文档、查询与 pooling 相关性判断开展大规模共同评测；系列常用 AP/MAP、P@k、Recall。&#x27;,note:&#x27;1992 是 TREC 首届年份，不是 MAP 的发明年；汇集标注仍可能遗漏相关文档。&#x27;,sources:[[&#x27;NIST · TREC Overview&#x27;,&#x27;https://trec.nist.gov/overview.html&#x27;]]},
      {id:&#x27;trecweb&#x27;,label:&#x27;TREC Web&#x27;,date:&#x27;1999 · 原始 Web Track&#x27;,era:1,lane:0,type:&#x27;fixed&#x27;,scope:&#x27;离线网页快照&#x27;,mechanism:&#x27;将 Web 网页集合纳入标准检索评测，按任务使用 MAP、P@k 等检索指标。&#x27;,note:&#x27;测网页集合上的检索，不直接测实时搜索引擎的抓取、时效和浏览全流程。&#x27;,sources:[[&#x27;NIST · 1999 官方资料&#x27;,&#x27;https://www-nlpir.nist.gov/works/presentations/search_engines99/index.htm&#x27;],[&#x27;Web Track 官方回顾&#x27;,&#x27;https://trec.nist.gov/pubs/trec18/papers/WEB09.OVERVIEW.pdf&#x27;]]},
      {id:&#x27;ndcg&#x27;,label:&#x27;DCG → nDCG&#x27;,date:&#x27;2000 → 2002 · 指标论文&#x27;,era:1,lane:0,type:&#x27;fixed&#x27;,scope:&#x27;排序指标 / 非题集&#x27;,mechanism:&#x27;从二元相关性扩展到分级相关性：按位置折扣累计收益，再归一化到理想排序。&#x27;,note:&#x27;DCG / nDCG 是指标家族，2002 对应完整 gain-based 论文；不同 k 和标注规则的分数不能直接横比。&#x27;,sources:[[&#x27;Cumulated Gain-based Evaluation&#x27;,&#x27;https://doi.org/10.1145/582415.582418&#x27;]]},
      {id:&#x27;diversity&#x27;,label:&#x27;Web 多样性评测&#x27;,date:&#x27;2009 · TREC Web Track&#x27;,era:1,lane:0,type:&#x27;fixed&#x27;,scope:&#x27;ClueWeb09 网页快照&#x27;,mechanism:&#x27;同时评主题相关性、子意图覆盖与新颖性；代表指标为 α-nDCG、Precision-IA、Expected MAP。&#x27;,note:&#x27;2009 官方指标不能与后续年份的 ERR-IA 混写；覆盖不同意图与找到同类结果是不同目标。&#x27;,sources:[[&#x27;TREC 2009 Web 官方报告&#x27;,&#x27;https://trec.nist.gov/pubs/trec18/papers/WEB09.OVERVIEW.pdf&#x27;]]},
      {id:&#x27;msmarco&#x27;,label:&#x27;MS MARCO&#x27;,date:&#x27;2016 · QA；2018 · 排序任务&#x27;,era:1,lane:1,type:&#x27;fixed&#x27;,scope:&#x27;真实查询 / 固定网页数据&#x27;,mechanism:&#x27;真实 Bing 问题、网页段落与人工答案；2016 QA 使用 ROUGE-L/BLEU，2018 passage ranking 常用 MRR@10、Recall。&#x27;,note:&#x27;数据来自真实 Web，但评测集固定；不能把 2018 的排序任务及 MRR@10 反推为 2016 原始任务。&#x27;,sources:[[&#x27;MS MARCO 原论文&#x27;,&#x27;https://www.microsoft.com/en-us/research/wp-content/uploads/2016/11/1611.09268v1.pdf&#x27;],[&#x27;官方任务演进&#x27;,&#x27;https://microsoft.github.io/msmarco/&#x27;]]},
      {id:&#x27;trecdl&#x27;,label:&#x27;TREC Deep Learning&#x27;,date:&#x27;2019 · 首届评测&#x27;,era:2,lane:0,type:&#x27;fixed&#x27;,scope:&#x27;固定段落 / 文档集&#x27;,mechanism:&#x27;以 MS MARCO 训练数据和 TREC 密集盲评比较神经检索，使用 nDCG@10、MAP、Recall@1000。&#x27;,note:&#x27;首届是 2019；后续 overview 论文上传年份不能替代评测年份。&#x27;,sources:[[&#x27;NIST · TREC 2019 DL&#x27;,&#x27;https://trec.nist.gov/pubs/trec28/papers/OVERVIEW.DL.pdf&#x27;]]},
      {id:&#x27;hotpot&#x27;,label:&#x27;HotpotQA 多跳&#x27;,date:&#x27;2018-09 · 论文首发&#x27;,era:2,lane:1,type:&#x27;fixed&#x27;,scope:&#x27;固定 Wikipedia&#x27;,mechanism:&#x27;跨多个文档回答问题，并标注 supporting facts；使用答案 EM/F1、支持事实 EM/F1、Joint EM/F1。&#x27;,note:&#x27;Fullwiki 设置仍基于 Wikipedia 快照；多跳题也可能存在推理捷径。&#x27;,sources:[[&#x27;HotpotQA 原论文&#x27;,&#x27;https://arxiv.org/abs/1809.09600&#x27;]]},
      {id:&#x27;nq&#x27;,label:&#x27;Natural Questions&#x27;,date:&#x27;2019-01-23 · 官方发布&#x27;,era:2,lane:1,type:&#x27;fixed&#x27;,scope:&#x27;真实查询 / 给定页面&#x27;,mechanism:&#x27;真实 Google 问题配 Wikipedia 页面，评长短答案与无答案；原任务使用 P/R/F1。&#x27;,note:&#x27;原始任务提供页面；NQ-Open 是衍生设置，常用 EM，但也通常使用固定知识源。&#x27;,sources:[[&#x27;Google · Natural Questions&#x27;,&#x27;https://research.google/blog/natural-questions-a-new-corpus-and-challenge-for-question-answering-research/&#x27;]]},
      {id:&#x27;fever&#x27;,label:&#x27;FEVER 声明核查&#x27;,date:&#x27;2018-03-14 · 论文首发&#x27;,era:2,lane:2,type:&#x27;fixed&#x27;,scope:&#x27;固定 Wikipedia&#x27;,mechanism:&#x27;要求判断声明真伪并找到支持或反驳证据；评 Label Accuracy、FEVER Score、Evidence P/R/F1。&#x27;,note:&#x27;同时找对证据与标签才算严格成功；合成修改的声明不能覆盖所有现实事实核查。&#x27;,sources:[[&#x27;FEVER 原论文&#x27;,&#x27;https://arxiv.org/abs/1803.05355&#x27;]]},
      {id:&#x27;kilt&#x27;,label:&#x27;KILT 答案与溯源&#x27;,date:&#x27;2020-09-04 · 论文首发&#x27;,era:2,lane:2,type:&#x27;fixed&#x27;,scope:&#x27;统一 Wikipedia 快照&#x27;,mechanism:&#x27;统一 QA、核查、对话等知识任务；同时评下游 EM/F1/Accuracy 与 provenance R-Precision、Recall@k、KILT score。&#x27;,note:&#x27;答案正确与来源正确分开看；共享固定知识源有利于比较，却没有实时 Web 变化。&#x27;,sources:[[&#x27;KILT 原论文&#x27;,&#x27;https://arxiv.org/abs/2009.02252&#x27;]]},
      {id:&#x27;beir&#x27;,label:&#x27;BEIR 跨域检索&#x27;,date:&#x27;2021-04-17 · 论文首发&#x27;,era:3,lane:0,type:&#x27;fixed&#x27;,scope:&#x27;18 个跨域固定数据集&#x27;,mechanism:&#x27;测零样本跨领域检索泛化，常用 nDCG@10、Recall@k。&#x27;,note:&#x27;比较检索器的迁移能力，不直接测浏览、写作、引用或时效性。&#x27;,sources:[[&#x27;BEIR 原论文&#x27;,&#x27;https://arxiv.org/abs/2104.08663&#x27;]]},
      {id:&#x27;alce&#x27;,label:&#x27;ALCE 引用生成&#x27;,date:&#x27;2023-05-24 · 论文首发&#x27;,era:3,lane:2,type:&#x27;fixed&#x27;,scope:&#x27;固定检索语料&#x27;,mechanism:&#x27;端到端评带引用的答案：Correctness、Fluency、Citation Precision / Recall。&#x27;,note:&#x27;关注引用对主张的支持与覆盖；引用内容支持某句，也不自动保证来源本身可信。&#x27;,sources:[[&#x27;ALCE 原论文&#x27;,&#x27;https://arxiv.org/abs/2305.14627&#x27;]]},
      {id:&#x27;ragas&#x27;,label:&#x27;RAGAS 分解评测&#x27;,date:&#x27;2023-09-26 · 论文首发&#x27;,era:3,lane:2,type:&#x27;hybrid&#x27;,scope:&#x27;评测框架 / 非联网题集&#x27;,mechanism:&#x27;用自动裁判分解 RAG；原始指标为 Faithfulness、Answer Relevance、Context Relevance。&#x27;,note:&#x27;框架可以接入不同系统；后来工具新增的指标不能全部写成 2023 原始指标。&#x27;,sources:[[&#x27;RAGAS 原论文&#x27;,&#x27;https://arxiv.org/abs/2309.15217&#x27;]]},
      {id:&#x27;freshqa&#x27;,label:&#x27;FreshQA 动态知识&#x27;,date:&#x27;2023-10-05 · 论文首发&#x27;,era:3,lane:1,type:&#x27;web&#x27;,scope:&#x27;动态题集 / 可联网&#x27;,mechanism:&#x27;覆盖快速变化知识和错误前提，评 strict / relaxed correctness 与幻觉，并按事实变化速度分层。&#x27;,note:&#x27;必须记录题集版本与执行日期；主要测更新事实，不等于深度研究报告能力。&#x27;,sources:[[&#x27;FreshLLMs / FreshQA 原论文&#x27;,&#x27;https://arxiv.org/abs/2310.03214&#x27;],[&#x27;FreshQA 官方更新记录&#x27;,&#x27;https://github.com/freshllms/freshqa&#x27;]]},
      {id:&#x27;gaia&#x27;,label:&#x27;GAIA 通用助手&#x27;,date:&#x27;2023-11-21 · 论文首发&#x27;,era:3,lane:3,type:&#x27;hybrid&#x27;,scope:&#x27;联网 + 文件 + 多模态&#x27;,mechanism:&#x27;真实问题要求推理与工具编排，包含联网、文件和多模态；使用 Answer Accuracy 与 Level 1/2/3 分层。&#x27;,note:&#x27;与搜索相关但不是纯搜索专项；任务表现还受文件处理等其他工具能力影响。&#x27;,sources:[[&#x27;GAIA 原论文&#x27;,&#x27;https://arxiv.org/abs/2311.12983&#x27;]]},
      {id:&#x27;crag&#x27;,label:&#x27;CRAG 综合 RAG&#x27;,date:&#x27;2024-06-07 · 论文首发&#x27;,era:4,lane:0,type:&#x27;fixed&#x27;,scope:&#x27;模拟网页 / KG API&#x27;,mechanism:&#x27;覆盖多领域、长尾及不同变化速度的事实；评 Accuracy、Hallucination / Missing rate 和奖惩总分。&#x27;,note:&#x27;这是 Comprehensive RAG Benchmark；配套 mock APIs 不等于开放 Web，也不同于同名 Corrective RAG 方法。&#x27;,sources:[[&#x27;CRAG 基准原论文&#x27;,&#x27;https://arxiv.org/abs/2406.04744&#x27;]]},
      {id:&#x27;browseplus&#x27;,label:&#x27;BrowseComp-Plus&#x27;,date:&#x27;2025-08-08 · 论文首发&#x27;,era:4,lane:0,type:&#x27;fixed&#x27;,scope:&#x27;固定网页语料 / 证据标注&#x27;,mechanism:&#x27;把难找事实转换为带证据和困难负例的固定语料评测，分析 Accuracy、检索召回、引用覆盖、调用和成本。&#x27;,note:&#x27;分离 retriever 与 agent 贡献并利于复现，同时减少真实 Web 变化和访问失败的影响。&#x27;,sources:[[&#x27;BrowseComp-Plus 原论文&#x27;,&#x27;https://arxiv.org/abs/2508.06600&#x27;]]},
      {id:&#x27;frames&#x27;,label:&#x27;FRAMES 多跳事实&#x27;,date:&#x27;2024-09-19 · 论文首发&#x27;,era:4,lane:1,type:&#x27;fixed&#x27;,scope:&#x27;固定 Wikipedia / BM25&#x27;,mechanism:&#x27;824 题涉及 2—15 个页面，联合事实正确性、检索与多跳推理；评答案准确性与证据召回。&#x27;,note:&#x27;原实验明确使用 Wikipedia dump 的 BM25 索引，而非在线搜索引擎；可迁移到联网设置。&#x27;,sources:[[&#x27;FRAMES 原论文&#x27;,&#x27;https://arxiv.org/abs/2409.12941&#x27;],[&#x27;原文检索设置&#x27;,&#x27;https://arxiv.org/html/2409.12941v3&#x27;]]},
      {id:&#x27;simpleqa&#x27;,label:&#x27;SimpleQA 短事实&#x27;,date:&#x27;2024-10-30 · 官方发布&#x27;,era:4,lane:1,type:&#x27;hybrid&#x27;,scope:&#x27;事实 QA / 非搜索专项&#x27;,mechanism:&#x27;4,326 个有唯一短答案的问题；评 Correct / Incorrect / Not attempted、Accuracy 与校准。&#x27;,note:&#x27;原始发布主要测不联网模型；可用于联网系统，但短答案成绩不能代替研究报告质量。&#x27;,sources:[[&#x27;OpenAI · SimpleQA&#x27;,&#x27;https://openai.com/index/introducing-simpleqa/&#x27;]]},
      {id:&#x27;agentdojo&#x27;,label:&#x27;AgentDojo 对抗测试&#x27;,date:&#x27;2024-06-19 · 论文首发&#x27;,era:4,lane:2,type:&#x27;hybrid&#x27;,scope:&#x27;工具环境 / 安全专项&#x27;,mechanism:&#x27;向不可信工具返回内容注入恶意指令，评正常任务成功率与攻击成功率。&#x27;,note:&#x27;不是搜索质量总分；提示注入鲁棒性应与正常答案和任务能力分别报告。&#x27;,sources:[[&#x27;AgentDojo 原论文&#x27;,&#x27;https://arxiv.org/abs/2406.13352&#x27;]]},
      {id:&#x27;drbench&#x27;,label:&#x27;DeepResearch Bench&#x27;,date:&#x27;2025-06-13 · 论文首发&#x27;,era:4,lane:2,type:&#x27;web&#x27;,scope:&#x27;开放 Web / 研究报告&#x27;,mechanism:&#x27;100 个任务、22 领域；RACE 评覆盖、深度、指令遵循、可读性，FACT 评引用准确与有效引用。&#x27;,note:&#x27;这是 Du 等人的报告基准；RACE 相对评分不是答案正确率，且受参考报告与裁判影响。&#x27;,sources:[[&#x27;DeepResearch Bench 原论文&#x27;,&#x27;https://arxiv.org/abs/2506.11763&#x27;]]},

      {id:&#x27;trendclaims&#x27;,label:&#x27;答对 × 引用 × 覆盖&#x27;,date:&#x27;已观察趋势 · 2023—2026&#x27;,era:6,lane:2,type:&#x27;hybrid&#x27;,scope:&#x27;可信性分解&#x27;,mechanism:&#x27;将答案正确、引用支持、证据覆盖、分析深度和呈现质量分别评价。&#x27;,note:&#x27;有引用不等于有支持；rubric 满足率与短答案正确率不能合成一个通用排名。&#x27;,sources:[[&#x27;ALCE&#x27;,&#x27;https://arxiv.org/abs/2305.14627&#x27;],[&#x27;DeepResearch Bench II&#x27;,&#x27;https://arxiv.org/abs/2601.08536&#x27;]]},

      {id:&#x27;futurebudget&#x27;,label:&#x27;统一预算与重复运行&#x27;,date:&#x27;展望 · 全栈评测建议&#x27;,era:7,lane:0,scope:&#x27;建议 / 非所有基准原生指标&#x27;,mechanism:&#x27;固定模型、工具、语料、版本与预算，同时报告成功率、延迟、调用、成本、失败率及重复运行方差。&#x27;,note:&#x27;这是评测设计建议；上面的基准并非都原生提供完整指标集合。&#x27;,sources:[[&#x27;BrowseComp-Plus&#x27;,&#x27;https://arxiv.org/abs/2508.06600&#x27;],[&#x27;AdaSearch&#x27;,&#x27;https://arxiv.org/abs/2512.16883&#x27;]]},

      {id:&#x27;futureaudit&#x27;,label:&#x27;研究质量与安全联合审计&#x27;,date:&#x27;展望 · 资料驱动推断&#x27;,era:7,lane:2,scope:&#x27;方向推断&#x27;,mechanism:&#x27;将已有的专家审计、自动裁判与提示注入测试统一纳入研究系统审计，分别报告质量与安全。&#x27;,note:&#x27;自动裁判可能偏置；安全能力应与正常质量、成本和可用性分别展示。&#x27;,sources:[[&#x27;DeepResearch Bench II&#x27;,&#x27;https://arxiv.org/abs/2601.08536&#x27;],[&#x27;AgentDojo&#x27;,&#x27;https://arxiv.org/abs/2406.13352&#x27;]]},

      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
