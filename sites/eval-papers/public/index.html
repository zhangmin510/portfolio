<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7faf9">
  <meta name="description" content="模型、AI 搜索、应用和 Agent 的评测论文阅读与推荐工作台。">
  <title>EvalPapers · 评测论文阅读室</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23116761'/%3E%3Cpath d='M10 7h8a6 6 0 0 1 0 12h-4v6h-4zm4 4v4h4a2 2 0 0 0 0-4z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip" href="#view">跳转到论文</a>
  <header class="topbar">
    <a href="#/discover" class="brand"><span class="brand-mark">P</span><span>Eval<span class="brand-light">Papers</span></span></a>
    <form class="search" id="search-form" role="search"><span aria-hidden="true">⌕</span><input id="query" type="search" aria-label="搜索论文" placeholder="搜索论文、作者、关键词…" autocomplete="off"><kbd>/</kbd><button type="submit">搜索</button></form>
    <button id="export" class="button top-export">导出阅读清单 <span aria-hidden="true">↗</span></button>
    <button class="button mobile-tools" data-action="about" aria-label="关于、导入与备份">备份 / 关于</button>
  </header>
  <aside id="sidebar" class="sidebar" aria-label="论文导航"></aside>
  <main id="view" tabindex="-1"><div class="loading">正在打开阅读室…</div></main>
  <dialog id="detail" aria-labelledby="detail-title"></dialog>
  <dialog id="preferences" aria-labelledby="preferences-title"></dialog>
  <dialog id="about" aria-labelledby="about-title"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <noscript>请启用 JavaScript 以浏览论文和使用本地阅读清单。</noscript>
</body>
</html>
